# Integración continua: compila y prueba cada componente en cada push y pull request.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  microservicios:
    name: ${{ matrix.servicio }} · build y pruebas
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [ms-organizacion, ms-empleados]
    defaults:
      run:
        working-directory: services/${{ matrix.servicio }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar y ejecutar pruebas unitarias
        run: mvn -B verify
      - name: Resumen de pruebas y cobertura
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv, glob, re
          t = f = 0
          for p in glob.glob('target/surefire-reports/*.txt'):
              m = re.search(r'Tests run: (\d+), Failures: (\d+), Errors: (\d+)', open(p).read())
              if m: t += int(m[1]); f += int(m[2]) + int(m[3])
          r = list(csv.DictReader(open('target/site/jacoco/jacoco.csv')))
          miss = sum(int(x['LINE_MISSED']) for x in r); cov = sum(int(x['LINE_COVERED']) for x in r)
          print(f"### ${{ matrix.servicio }}\n- Pruebas: {t} ({f} fallidas)\n- Cobertura de líneas: {100*cov/(miss+cov):.1f} %")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-${{ matrix.servicio }}
          path: services/${{ matrix.servicio }}/target/site/jacoco/

  frontend:
    name: frontend · pruebas y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Pruebas unitarias (Vitest)
        run: npm test
      - name: Compilación de producción
        run: npm run build
        env:
          VITE_API_URL: https://example.invalid
          VITE_ENTRA_CLIENT_ID: 00000000-0000-0000-0000-000000000000
          VITE_ENTRA_AUTHORITY: https://example.ciamlogin.com/
          VITE_API_SCOPE: api://00000000-0000-0000-0000-000000000000/access_as_user

  infraestructura:
    name: terraform · formato y validación
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Formato (aviso)
        run: terraform fmt -check -recursive -diff || echo "::warning::Ejecuta terraform fmt para alinear el formato"
      - run: terraform init -backend=false
      - run: terraform validate
